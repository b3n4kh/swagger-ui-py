[tox]
envlist = py312,py313

[testenv]
extras = test
commands = pytest -q test/

[testenv:check]
extras = dev
commands =
    ruff check .
    isort --line-width=100 --force-single-line-imports --check .

[testenv:update]
basepython = python3.12
passenv = PATH, npm_config_cache
commands = python tools/update.py --ui --editor
