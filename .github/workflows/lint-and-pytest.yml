name: tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - README.md
  pull_request:
    paths-ignore:
      - README.md

jobs:
  lint-and-pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --frozen --all-extras --dev

    - name: isort
      run: uv run isort --line-width=100 --check-only --force-single-line-imports .

    - name: Lint with ruff
      run: uv run ruff check --output-format=github .

    - name: Verify bundled assets
      run: uv run python tools/verify_assets.py

    - name: Run tests
      run: uv run pytest -q test/

    - name: Build and inspect wheel
      run: |
        uv build
        uv run python tools/verify_assets.py dist/*.whl
