<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> {{ title }} </title>
  <link href="{{ url_prefix }}/static/editor/swagger-editor.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_prefix }}/static/favicon-32x32.png" sizes="32x32">
  <style>
    html, body, #swagger-editor { height: 100%; margin: 0; }
  </style>
</head>
<body>
  <div id="swagger-editor"></div>
  <script src="{{ url_prefix }}/static/editor/swagger-editor.js"></script>
  <script>
    window.MonacoEnvironment = {
      baseUrl: new URL({{ (url_prefix ~ '/static/editor/')|tojson }}, window.location.href).href
    };
    SwaggerEditor(document.getElementById('swagger-editor'), {
      url: {{ config_url|tojson }},
      queryConfigEnabled: false
    });
  </script>
</body>
</html>
